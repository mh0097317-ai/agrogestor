<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#07111F" />
    <title>StudioFlow · Sem conexão</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #111827;
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: 100%;
        max-width: 440px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        padding: 40px;
        text-align: left;
      }
      img {
        width: 48px;
        height: 48px;
        margin-bottom: 32px;
      }
      small {
        display: block;
        color: #64748b;
        font-size: 12px;
        letter-spacing: 0.12em;
      }
      h1 {
        font-size: 32px;
        letter-spacing: -0.05em;
        line-height: 1.15;
        margin: 14px 0;
      }
      p {
        color: #64748b;
        font-size: 15px;
        line-height: 1.7;
        margin: 0 0 28px;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, #07111f, #0d2847 55%, #123e69);
        color: white;
        min-height: 48px;
        padding: 14px 24px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
        width: 100%;
      }
      button:focus-visible {
        outline: 3px solid #123e6960;
        outline-offset: 3px;
      }
      @media (max-width: 430px) {
        main {
          padding: 28px;
        }
        h1 {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="StudioFlow" /><small>VAMOS RECONECTAR</small>
      <h1>Sua agenda precisa de conexão.</h1>
      <p>
        Conecte-se à internet para consultar os horários atualizados e continuar
        de onde parou.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
